name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    if: ${{ hashFiles('backend/LogistiCore.slnx') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet restore backend/LogistiCore.slnx
      - run: dotnet build backend/LogistiCore.slnx --no-restore -c Release
      - run: dotnet test backend/LogistiCore.slnx --no-build -c Release
  frontend:
    runs-on: ubuntu-latest
    if: ${{ hashFiles('frontend/package.json') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
